name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install -e ".[dev,gui-build]"
      - name: Run automated checks
        run: |
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .
      - name: Build standalone application
        run: pyinstaller --clean --noconfirm MemoryExportConverter.spec
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/MemoryExportConverter.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MemoryExportConverter.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/MemoryExportConverter.exe
      - uses: actions/upload-artifact@v7
        with:
          name: MemoryExportConverter-Windows
          path: |
            dist/MemoryExportConverter.exe
            dist/SHA256SUMS.txt
      - name: Attach application to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MemoryExportConverter.exe
            dist/SHA256SUMS.txt
