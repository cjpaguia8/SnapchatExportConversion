name: Build Windows application

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and build tools
        run: python -m pip install -e ".[dev,gui-build]"
      - name: Run automated checks
        run: |
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .
      - name: Build standalone application
        run: pyinstaller --clean --noconfirm SnapchatExportConversion.spec
      - uses: actions/upload-artifact@v4
        with:
          name: SnapchatExportConversion-Windows
          path: dist/SnapchatExportConversion.exe
      - name: Attach application to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SnapchatExportConversion.exe
