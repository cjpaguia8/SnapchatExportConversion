[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-export-converter"
version = "1.1.0"
description = "Command-line tools for converting media and recovering Snapchat memory exports"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["imageio-ffmpeg>=0.5", "Pillow>=10.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.9"]
gui-build = ["pyinstaller>=6.0"]

[project.scripts]
memory-convert = "memory_export_converter.convert:main"
memory-unzip = "memory_export_converter.snapchat:main"
memory-export-converter = "memory_export_converter.cli:main"
memory-export-converter-gui = "memory_export_converter.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
